name: Validate TRUE SURF landing package

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-landing.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Download supplied landing package
        run: |
          set -euo pipefail
          curl -fL --retry 2 'https://firestorage.ai/ja/f/ks4cbNXJNx7k' -o /tmp/landing-package
          file /tmp/landing-package
          ls -lh /tmp/landing-package
          unzip -t /tmp/landing-package
