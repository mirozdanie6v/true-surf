name: Validate TRUE SURF landing payload

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-landing.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify supplied landing payload
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            906845908704e612bab37445a17f8702ba7e1b368439266b7b001dffdbc33d5d
            df0230a28bc6e2486a79bf7f336de581fe813e8ddde67e598308c0ce2240aacb
            40103e0b0ada60533bfb3ec9fbba39e8865df50e214cebfc49fc242521f316a1
            b8fbd805d23ab5960844eba38188003ac2620da0507a2e50d1344e6336ed95db
            58a914edb6a3640ffb64d9fe656aac3964ceedabfac62156e15acc8b3c77d81f
            dd8136e87b7306414d7660eafb287b9188fc5ba6cf46f306e25bd81f0cc44fcf
          )
          for n in 1 2 3 4 5 6; do
            actual="$(sha256sum "public/landing-parts/$n.txt" | awk '{print $1}')"
            echo "part $n: $actual"
            test "$actual" = "${expected[$((n-1))]}"
          done
          cat public/landing-parts/{1,2,3,4,5,6}.txt | base64 -d > /tmp/index.html
          actual_html="$(sha256sum /tmp/index.html | awk '{print $1}')"
          echo "index.html: $actual_html"
          test "$actual_html" = "e055f70c5f16f57ff6aa18c182d2e5d2fef5f169bbeaadd5457e9dbfd2939843"
          grep -q '<title>TRUE SURF' /tmp/index.html
          grep -q 'id="leadForm"' /tmp/index.html
          echo 'Landing payload matches uploaded index.html exactly.'
