name: Deploy TRUE SURF Mini App

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/trigger-miniapp-deploy

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout TRUE SURF Mini App source
        uses: actions/checkout@v4
        with:
          ref: 5a3cc0c6bd727c049c5edb7b99da766cc34e4d63

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure Mini App Worker
        run: |
          cat > wrangler.jsonc <<'EOF'
          {
            "$schema": "./node_modules/wrangler/config-schema.json",
            "main": ".open-next/worker.js",
            "name": "true-surf-app",
            "compatibility_date": "2026-08-21",
            "compatibility_flags": ["nodejs_compat"],
            "routes": [
              {
                "pattern": "truesurf-app.viiversion.com",
                "custom_domain": true
              }
            ],
            "assets": {
              "directory": ".open-next/assets",
              "binding": "ASSETS"
            },
            "observability": {
              "enabled": true
            }
          }
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build Cloudflare Worker
        run: npx opennextjs-cloudflare build

      - name: Deploy TRUE SURF Mini App
        run: npx wrangler deploy
