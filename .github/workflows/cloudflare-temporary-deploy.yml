name: Temporary Cloudflare deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cloudflare-temporary-deploy.yml
      - .github/temporary-deploy-public.pem

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Cloudflare Worker
        run: npx opennextjs-cloudflare build

      - name: Deploy to a temporary Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          deploy_log="$RUNNER_TEMP/cloudflare-deploy.log"
          npx wrangler deploy --temporary >"$deploy_log" 2>&1

          claim_url="$(grep -Eo 'https://dash\.cloudflare\.com/claim-preview\?claimToken=[^[:space:]]+' "$deploy_log" | head -n 1 || true)"
          if [[ -z "$claim_url" ]]; then
            sed -E 's#claimToken=[^[:space:]]+#claimToken=[REDACTED]#g' "$deploy_log"
            echo "Cloudflare did not return a claim URL." >&2
            exit 1
          fi

          printf '%s' "$claim_url" >"$RUNNER_TEMP/claim-url.txt"
          openssl pkeyutl -encrypt \
            -pubin \
            -inkey .github/temporary-deploy-public.pem \
            -in "$RUNNER_TEMP/claim-url.txt" \
            -out claim-url.enc \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256

          preview_url="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' "$deploy_log" | head -n 1 || true)"
          echo "Temporary Cloudflare deployment created."
          echo "Preview: ${preview_url:-see Cloudflare after claiming}"

      - name: Upload encrypted claim link
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-claim-link
          path: claim-url.enc
          retention-days: 1
          if-no-files-found: error
