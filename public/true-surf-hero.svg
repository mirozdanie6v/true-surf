<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Tropical surf scene at Bai Dai">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1FB7B2"/>
      <stop offset="0.48" stop-color="#6DD9D2"/>
      <stop offset="1" stop-color="#FFF7E8"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1">
